<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clicker Game 45s</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; text-align: center; background: #f0f4f8; margin: 0; padding: 20px; touch-action: manipulation; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); max-width: 380px; margin: auto; }
        #btn { width: 180px; height: 180px; border-radius: 50%; border: 8px solid #eee; background: #ff4757; color: white; font-size: 30px; font-weight: bold; cursor: pointer; margin: 20px 0; -webkit-tap-highlight-color: transparent; }
        #btn:active { transform: scale(0.92); background: #ff6b81; }
        #btn:disabled { background: #ccc; cursor: not-allowed; }
        .score { font-size: 40px; font-weight: bold; color: #2d3436; }
        input { padding: 12px; width: 85%; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 15px; text-align: center; }
        .leaderboard { margin-top: 25px; text-align: left; background: #f8f9fa; padding: 15px; border-radius: 12px; height: 200px; overflow-y: auto; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .start-btn { padding: 12px 25px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏆 เกมกดแข่งกัน (45 วิ)</h2>
    <input type="text" id="playerName" placeholder="พิมพ์ชื่อของคุณที่นี่">
    <button onclick="startGame()" id="startBtn" class="start-btn">เริ่มเล่น!</button>
    
    <div class="score">แต้ม: <span id="scoreDisplay">0</span></div>
    <div id="timerDisplay" style="color: #ff4757; font-weight: bold; font-size: 20px;">เวลาเหลือ: 45</div>
    
    <button id="btn" onclick="hit()" disabled>กดรัวๆ!</button>

    <div class="leaderboard">
        <h4 style="text-align:center; margin:0 0 10px 0;">อันดับสูงสุด 👑</h4>
        <div id="list">กำลังโหลดคะแนน...</div>
    </div>
</div>

<script>
    let score = 0, time = 0, timer;
    // นำ URL ที่ก๊อปปี้จาก Google มาวางในเครื่องหมาย ' ' ด้านล่างนี้
    const scriptURL = 'https://script.google.com/macros/s/AKfycby21gY7Tnv6yF-_lvGwf80NLxC6LQUmHz1OCAWMKPQ3KnmVh_O2Dv9cva3Q7BFUUnqERQ/exec'; 

    function loadLeaderboard() {
        fetch(scriptURL).then(r => r.json()).then(data => {
            let html = '';
            data.slice(0, 10).forEach((row, i) => {
                html += `<div class="row"><span>${i+1}. ${row[0]}</span><b>${row[1]} แต้ม</b></div>`;
            });
            document.getElementById('list').innerHTML = html || 'ยังไม่มีใครเล่น';
        }).catch(err => document.getElementById('list').innerHTML = 'โหลดคะแนนไม่สำเร็จ');
    }

    function startGame() {
        const name = document.getElementById('playerName').value;
        if(!name) return alert('กรุณาใส่ชื่อก่อนเล่นครับ');
        
        score = 0; time = 45;
        document.getElementById('scoreDisplay').innerText = 0;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('btn').disabled = false;
        document.getElementById('playerName').disabled = true;
        
        timer = setInterval(() => {
            time--;
            document.getElementById('timerDisplay').innerText = 'เวลาเหลือ: ' + time;
            if(time <= 0) {
                clearInterval(timer);
                document.getElementById('btn').disabled = true;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('playerName').disabled = false;
                saveScore(name, score);
            }
        }, 1000);
    }

    function hit() { 
        score++; 
        document.getElementById('scoreDisplay').innerText = score; 
    }

    function saveScore(name, finalScore) {
        document.getElementById('list').innerHTML = 'กำลังบันทึกคะแนน...';
        fetch(scriptURL, { 
            method: 'POST', 
            body: JSON.stringify({ name: name, score: finalScore }) 
        })
        .then(() => { 
            alert('จบเกม! คุณ ' + name + ' ทำได้ ' + finalScore + ' แต้ม'); 
            loadLeaderboard(); 
        });
    }

    // โหลดคะแนนทันทีที่เปิดหน้าเว็บ
    loadLeaderboard();
</script>
</body>
</html>
